name: Release

# Publishes a ready-to-install bundle tarball when a version tag is pushed.
# Nothing is published to npm; the GitHub Release asset is the distribution channel.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Pack and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify bundle package
        run: node scripts/verify.mjs

      - name: Pack npm tarball
        run: |
          set -euo pipefail
          npm pack
          sha256sum dsh-cabinet-mode-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dsh-cabinet-mode-*.tgz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
