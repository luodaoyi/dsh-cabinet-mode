name: Release

# Publishes dsh-cabinet-mode to the public npm registry with npm Trusted
# Publishing (OIDC) when a version tag is pushed, then creates the GitHub Release
# and refreshes the plugin market index branch that DSH reads.
#
# No npm token is used or configured here: `id-token: write` is the only
# credential. The npm side must already have a trusted publisher for this package
# that names this workflow file (`release.yml`), allows `npm publish`, and matches
# repository.url in package.json. See "Releasing (maintainers)" in README.md.
#
# Keep the publish step in this file: npm validates the workflow *file name*
# against the trusted publisher, and a reusable workflow would make the calling
# workflow's name part of that check instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm and create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Require the tagged commit to be contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not contained in main; refusing to publish"
            exit 1
          fi

      - name: Require package.json and CHANGELOG to match the tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$version" ]; then
            echo "::error::package.json version ${package_version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no [${version}] section"
            exit 1
          }

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify the package and the market index scripts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify.mjs
          node --check scripts/market-index.mjs
          bash -n scripts/publish-market-index.sh

      - name: Pack the tarball and inspect its contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          sha256sum dsh-cabinet-mode-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          tar -tzf dsh-cabinet-mode-*.tgz > tarball.txt
          for file in \
            package/package.json \
            package/cordis.patch.yml \
            package/icon.svg \
            package/README.md \
            package/README.zh.md \
            package/docs/cross-platform.md \
            package/scripts/market-index.mjs \
            package/scripts/publish-market-index.sh; do
            grep -qx "$file" tarball.txt || {
              echo "::error::$file is missing from the tarball"
              exit 1
            }
          done

      - name: Publish to npm with the trusted publisher
        shell: bash
        run: |
          set -euo pipefail
          # A prerelease must not move the `latest` dist-tag: the market index skips
          # prerelease versions, so `latest` would otherwise point at a version the
          # index never lists.
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          npm publish ./dsh-cabinet-mode-*.tgz --access public --tag "$tag"

      - name: Create the GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" ./dsh-cabinet-mode-*.tgz SHA256SUMS.txt \
            --verify-tag --generate-notes

  market-index:
    name: Refresh the plugin market index
    # Prerelease versions are excluded by the index rules, so a refresh for a
    # prerelease tag would only fail with a false "no installable versions" error,
    # and a prerelease must not refresh the stable index either.
    if: ${{ !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # force-push the market-index branch
    concurrency:
      group: market-index-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Regenerate the index from the npm registry
        shell: bash
        env:
          # Wait for the version this run just published: npm can serve an older
          # packument for a few minutes after `npm publish` returns.
          MARKET_EXPECT_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          export MARKET_EXPECT_VERSION="${MARKET_EXPECT_VERSION#v}"
          node scripts/market-index.mjs

      - name: Publish the market-index branch
        shell: bash
        run: bash scripts/publish-market-index.sh
