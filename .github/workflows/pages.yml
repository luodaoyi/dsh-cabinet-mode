name: Pages deploy

# Publishes the static intro site in `site/` to GitHub Pages as a project page
# (https://luodaoyi.github.io/dsh-cabinet-mode/). The site is plain HTML/CSS/JS
# with no build step, so this workflow only uploads the directory as-is.
#
# One-time repository setup: none needed. `configure-pages` runs with
# `enablement: true`, so the first run creates the Pages site with
# build_type=workflow using the workflow's own GITHUB_TOKEN; the manual
# Settings → Pages flip is only a fallback if that API call is refused.
#
# The site directory is intentionally outside package.json `files`, so this
# workflow never affects the npm bundle or the market index.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Deploy the intro site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Keep the existing public site until its versioned download exists.
      # The Release completion event retries deployment after publishing.
      - name: Check the public download asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          READY=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft | jq -r --arg tag "v$VERSION" 'any(.[]; .tagName == $tag and .isDraft == false)')
          if [ "$READY" = true ]; then
            READY=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" | jq -r --arg name "dsh-cabinet-mode-$VERSION.tgz" '.assets | any(.name == $name and .state == "uploaded")')
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.release.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true # create the site on the first run if missing

      - name: Upload the site directory
        if: steps.release.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.release.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
