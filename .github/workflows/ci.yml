name: CI

# Pull-request and main-branch checks only. The npm publish step lives in
# release.yml exclusively: npm Trusted Publishing validates the workflow file
# name, so publishing is deliberately not moved behind a reusable workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Repository and package checks
        run: node scripts/verify.mjs

      - name: Script syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/market-index.mjs
          bash -n scripts/publish-market-index.sh

      - name: Market contract regressions
        run: |
          npm ci --ignore-scripts
          node scripts/test-market-index.mjs

      - name: Market publisher regressions
        shell: bash
        run: bash scripts/test-market-publish.sh

      - name: Check the publish tarball without credentials
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run > pack-dry-run.txt 2>&1
          cat pack-dry-run.txt
          npm pack
          tar -tzf dsh-cabinet-mode-*.tgz > tarball.txt
          for file in \
            package/package.json \
            package/cordis.patch.yml \
            package/icon.svg \
            package/scripts/market-index.mjs; do
            grep -qx "$file" tarball.txt || {
              echo "::error::$file is missing from the tarball"
              exit 1
            }
          done

  model-compatibility:
    name: Official model APIs (${{ matrix.dsh }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh: [0.2.1-rc.5, 0.2.2-rc.1]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm for isolated DSH profile composition
        if: matrix.dsh == '0.2.2-rc.1'
        run: |
          npm install --global pnpm@11.13.1
          pnpm --version
      - run: npm ci --ignore-scripts
      - name: Install isolated official runtime (no model credentials)
        run: npm install --prefix "$RUNNER_TEMP/cabinet-runtime" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Official component regressions
        env:
          DSH_MODULE_ROOT: ${{ runner.temp }}/cabinet-runtime/node_modules
          DSH_TEST_VERSION: ${{ matrix.dsh }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DSH_TEST_VERSION" == "0.2.2-rc.1" ]]; then
            node scripts/test-model-prepared.mjs
            export PATH="$DSH_MODULE_ROOT/.bin:$PATH"
            node scripts/verify.mjs
          else
            node scripts/test-model-selection.cjs
          fi
          node scripts/test-prompt-assembly.cjs
      - name: Isolated real DSH web startup and plugin asset smoke (no model)
        if: matrix.dsh == '0.2.2-rc.1'
        env:
          DSH_MODULE_ROOT: ${{ runner.temp }}/cabinet-runtime/node_modules
        run: node scripts/test-dsh-web-smoke.mjs


  browser-regression:
    name: Real Chromium panel and groupchat regressions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated pinned browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/cabinet-browser" --ignore-scripts --no-audit --no-fund react@19.3.1 react-dom@19.3.1 esbuild@0.25.12 playwright-core@1.65.0
      - name: Install Chinese fonts for visual regression evidence
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -F 'Noto Sans CJK SC'
      - name: Run real Chromium regressions with synthetic session services
        env:
          DSH_BROWSER_TEST_ROOT: ${{ runner.temp }}/cabinet-browser
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          CABINET_SCREENSHOT="$RUNNER_TEMP/panel.png" node scripts/test-panel-browser.mjs --headless
          CABINET_SCREENSHOT="$RUNNER_TEMP/groupchat.png" node scripts/test-groupchat-browser.mjs --headless
          CABINET_SCREENSHOT="$RUNNER_TEMP/page.png" node scripts/test-page-browser.mjs --headless
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabinet-browser-evidence
          path: |
            ${{ runner.temp }}/panel.png
            ${{ runner.temp }}/groupchat.png
            ${{ runner.temp }}/page.png
          if-no-files-found: ignore
